<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071d38"><title>Schedule · U12 Tournament 2026</title><link rel="stylesheet" href="assets/style.css"></head><body><header><div class="wrap"><a class="brand" href="index.html">U12 Tournament <b>2026</b></a><nav><a href="schedule.html" class="on">Schedule</a><a href="live.html">Live</a><a href="standings.html">Standings</a><a href="stats.html">Player stats</a></nav></div></header><main class="wrap"><section class="card"><div class="section-head"><div><h1>Schedule & results</h1><p class="muted">Browse every day of the tournament.</p></div><div class="tabs" id="tabs"></div></div></section><div id="content"></div></main><footer>U12 Tournament 2026 · Public results service</footer><script src="assets/common.js"></script><script>let selected='all';loadData().then(({schedule,results})=>{schedule=effectiveSchedule(schedule,results);const dates=[...new Set(schedule.map(g=>g.date))];tabs.innerHTML=`<button class="tab on" data-day="all">All days</button>`+dates.map(d=>`<button class="tab" data-day="${d}">${DAYS[d].split(',')[0]}</button>`).join('');function render(){content.innerHTML=dates.filter(d=>selected==='all'||d===selected).map(d=>`<section class="card"><h2>${DAYS[d]}</h2><div class="table"><table><thead><tr><th>Game</th><th>Time</th><th class="hide-sm">Field</th><th>Match-up</th><th>Score</th><th>Status</th></tr></thead><tbody>${schedule.filter(g=>g.date===d).map(g=>{const r=gameData(g,results);return `<tr><td>${esc(g.game)}</td><td>${g.time}</td><td class="hide-sm">${esc(g.field)}</td><td><b>${esc(g.team1)}</b><span class="muted">vs <b>${esc(g.team2)}</b><br> · ${esc(g.phase)}</span></td><td class="score">${score(r)}</td><td>${badge(r.status)}</td></tr>`}).join('')}</tbody></table></div></section>`).join('')}tabs.onclick=e=>{if(!e.target.dataset.day)return;selected=e.target.dataset.day;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===e.target));render()};render()}).catch(e=>content.innerHTML=`<p class="notice error">${esc(e.message)}</p>`)</script></body></html>
