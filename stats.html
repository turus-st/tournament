<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071d38"><title>Player statistics · U12 Tournament 2026</title><link rel="stylesheet" href="assets/style.css"></head><body><header><div class="wrap"><a class="brand" href="index.html">U12 Tournament <b>2026</b></a><nav><a href="schedule.html">Schedule</a><a href="live.html">Live</a><a href="standings.html">Standings</a><a href="stats.html" class="on">Player stats</a></nav></div></header><main class="wrap"><section class="card"><h1>Individual performance summary</h1><p>Totals are aggregated from the game records published by the tournament administrator.</p></section><section class="card"><h2>Pitching</h2><div class="table" id="pitching"></div></section><section class="card"><h2>Batting</h2><div class="table" id="batting"></div></section><section class="card"><h2>Match MVPs</h2><div id="mvps"></div></section></main><footer>U12 Tournament 2026 · Public results service</footer><script src="assets/common.js"></script><script>loadData().then(({schedule,results})=>{const p={},b={},m=[];schedule.forEach(g=>{const r=gameData(g,results);r.pitchers.forEach(x=>{const k=x.name.trim().toLowerCase()+'|'+x.team.trim().toLowerCase();p[k]??={name:x.name,team:x.team,games:0,rl:0,runsAllowed:0,pgl:0};p[k].games++;p[k].rl+=Number(x.rl)||0;p[k].runsAllowed+=Number(x.runsAllowed)||0;p[k].pgl+=Number(x.pgl)||0});r.batters.forEach(x=>{const k=x.name.trim().toLowerCase()+'|'+x.team.trim().toLowerCase();b[k]??={name:x.name,team:x.team,games:0,h:0,tb:0,ab:0,rbi:0};b[k].games++;['h','tb','ab','rbi'].forEach(f=>b[k][f]+=Number(x[f])||0)});if(r.mvp?.name)m.push({game:g.game,match:`${g.team1} vs ${g.team2}`,...r.mvp})});const pr=Object.values(p).sort((a,z)=>a.team.localeCompare(z.team)||a.name.localeCompare(z.name)),br=Object.values(b).sort((a,z)=>a.team.localeCompare(z.team)||a.name.localeCompare(z.name));pitching.innerHTML=`<table><thead><tr><th>Name</th><th>Team</th><th>Games</th><th>RL</th><th>Runs allowed</th><th>PGL</th></tr></thead><tbody>${pr.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.team)}</td><td>${x.games}</td><td>${x.rl}</td><td>${x.runsAllowed}</td><td>${x.pgl}</td></tr>`).join('')}</tbody></table>`;batting.innerHTML=`<table><thead><tr><th>Name</th><th>Team</th><th>Games</th><th>H</th><th>TB</th><th>AB</th><th>RBI</th></tr></thead><tbody>${br.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.team)}</td><td>${x.games}</td><td>${x.h}</td><td>${x.tb}</td><td>${x.ab}</td><td>${x.rbi}</td></tr>`).join('')}</tbody></table>`;mvps.innerHTML=m.length?m.map(x=>`<p><b>Game ${esc(x.game)} · ${esc(x.name)}</b> <span class="muted">${esc(x.team)} · ${esc(x.match)}</span><br>${esc(x.notes)}</p>`).join(''):'<p class="muted">No MVP has been published yet.</p>'}).catch(e=>pitching.innerHTML=`<p class="notice error">${esc(e.message)}</p>`)</script></body></html>
