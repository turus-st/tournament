<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Tournament administration</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="admin-header"><div class="wrap"><b>Tournament administration</b><span>Unlisted page</span></div></div><main class="wrap"><section class="card setup"><h1>Repository connection</h1><p>This unlisted page edits <code>data/results.json</code> through the GitHub Contents API. The token is kept in this browser session only and is never written to the repository.</p><div class="formgrid"><label class="wide">GitHub owner<input id="owner" placeholder="account-name"></label><label class="wide">Repository<input id="repo" placeholder="repository-name"></label><label>Branch<input id="branch" value="main"></label><label class="full">Fine-grained token<input id="token" type="password" autocomplete="off" placeholder="Token with Contents: Read and write"></label></div><div class="toolbar" style="margin-top:12px"><button class="btn" id="connect">Connect and load</button><label class="btn alt">Import JSON<input id="import" type="file" accept="application/json" hidden></label><button class="btn alt" id="export">Export JSON</button></div><p id="msg" class="notice hidden"></p></section><section id="editor" class="hidden"><section class="card"><div class="toolbar"><label>Select game<select id="gameSelect"></select></label><button class="btn" id="publish">Publish to GitHub</button></div></section><form id="gameForm"><section class="card"><h2 id="gameTitle"></h2><div class="formgrid"><label class="wide">Status<select id="status"><option value="scheduled">Scheduled</option><option value="live">In progress</option><option value="completed">Completed</option></select></label><label>Score team 1<input id="score1" type="number" min="0"></label><label>Score team 2<input id="score2" type="number" min="0"></label></div></section><section class="card"><div class="toolbar"><h2>Pitchers</h2><button type="button" class="btn alt" data-add="pitchers">Add pitcher</button></div><div id="pitchers"></div></section><section class="card"><div class="toolbar"><h2>Batters</h2><button type="button" class="btn alt" data-add="batters">Add batter</button></div><div id="batters"></div></section><section class="card"><h2>Match MVP</h2><div class="formgrid"><label class="wide">Name<input id="mvpName"></label><label class="wide">Team<input id="mvpTeam"></label><label class="full">Notes<textarea id="mvpNotes" rows="3"></textarea></label></div></section><button type="button" class="btn" id="saveLocal">Save game in working copy</button></form></section></main><script src="assets/common.js"></script><script src="assets/admin.js"></script></body></html>
