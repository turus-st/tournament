<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071d38"><title>Live results · U12 Tournament 2026</title><link rel="stylesheet" href="assets/style.css"></head><body><header><div class="wrap"><a class="brand" href="index.html">U12 Tournament <b>2026</b></a><nav><a href="schedule.html">Schedule</a><a href="live.html" class="on">Live</a><a href="standings.html">Standings</a><a href="stats.html">Player stats</a></nav></div></header><main class="wrap"><section class="card"><div class="section-head"><div><h1>Live results</h1><p class="muted">This page refreshes automatically every 20 seconds.</p></div><span class="status live"><span class="live-dot"></span>LIVE</span></div><div id="live"></div></section></main><footer>U12 Tournament 2026 · Public results service</footer><script src="assets/common.js"></script><script>async function render(){try{let {schedule,results}=await loadData();schedule=effectiveSchedule(schedule,results);const games=schedule.map(g=>[g,gameData(g,results)]).filter(([,r])=>r.status!=='scheduled').sort((a,b)=>(a[1].status==='live'?-1:1)-(b[1].status==='live'?-1:1)||String(b[1].updatedAt||'').localeCompare(String(a[1].updatedAt||''))).slice(0,20);live.innerHTML=games.length?games.map(([g,r])=>`<article class="match"><div><b>${g.time.split('–')[0]}</b><br><small class="muted">#${g.game}</small></div><div><div class="teamline"><b>${esc(g.team1)}</b><span class="score">${r.score1??'–'}</span></div><div class="teamline"><b>${esc(g.team2)}</b><span class="score">${r.score2??'–'}</span></div><small class="muted">${esc(g.field)} · ${esc(g.phase)}</small></div>${badge(r.status)}</article>`).join(''):'<p class="notice">No live or completed games are available yet.</p>'}catch(e){live.innerHTML=`<p class="notice error">${esc(e.message)}</p>`}}render();setInterval(render,20000)</script></body></html>
